<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>印章识别</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2744;
      --paper: #f7f3ea;
      --paper-deep: #ebe4d4;
      --blue: #1e4a9c;
      --yellow: #d4a017;
      --line: #c8bfa8;
      --accent: #b5451b;
      --ok: #2d6a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", "Noto Serif SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #fff8e8 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 20%, #e8eef8 0%, transparent 50%),
        var(--paper);
      min-height: 100vh;
    }
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      margin: 0 0 0.35rem;
    }
    header p { margin: 0; opacity: 0.8; max-width: 36rem; line-height: 1.5; }
    a.link {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--blue) 40%, transparent);
      font-size: 0.9rem;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      gap: 1.25rem;
    }
    .upload-zone {
      border: 1.5px dashed var(--line);
      background: #fffdf8;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--blue);
      background: #f3f7ff;
    }
    .upload-zone strong {
      font-family: "Noto Serif SC", serif;
      font-size: 1.1rem;
    }
    .upload-zone span { font-size: 0.88rem; opacity: 0.7; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    button, .btn {
      font: inherit;
      padding: 0.55rem 1.1rem;
      border: none;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    button.secondary, .btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="file"] { display: none; }
    .status {
      font-size: 0.9rem;
      min-height: 1.4em;
    }
    .status.err { color: var(--accent); }
    .status.ok { color: var(--ok); }
    .layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }
    .panel h2 {
      font-family: "Noto Serif SC", serif;
      font-size: 1.05rem;
      margin: 0 0 0.75rem;
    }
    .preview {
      background: #fff;
      border: 1px solid var(--line);
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .preview img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .preview .placeholder { opacity: 0.45; font-size: 0.9rem; padding: 2rem; text-align: center; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }
    @media (max-width: 600px) {
      .summary { grid-template-columns: 1fr 1fr; }
    }
    .stat {
      background: #fff;
      border: 1px solid var(--line);
      padding: 0.55rem 0.65rem;
    }
    .stat b { display: block; font-size: 1.2rem; color: var(--blue); }
    .stat span { font-size: 0.75rem; opacity: 0.65; }
    .methods {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.8rem;
    }
    .methods .chip {
      border: 1px solid var(--line);
      background: #fff;
      padding: 0.2rem 0.5rem;
      font-size: 0.78rem;
    }
    .methods .chip b { color: var(--blue); }
    .warn {
      border-left: 3px solid #d98524;
      background: #fff7ec;
      padding: 0.45rem 0.6rem;
      font-size: 0.8rem;
      margin-bottom: 0.8rem;
    }
    .edit-note {
      border-left: 3px solid var(--accent);
      background: #fdf7f3;
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      margin-bottom: 0.8rem;
    }
    .list {
      display: grid;
      gap: 0.55rem;
      max-height: 520px;
      overflow: auto;
    }
    .card {
      background: linear-gradient(160deg, #fff 0%, var(--paper-deep) 100%);
      border: 1px solid var(--line);
      padding: 0.7rem 0.8rem;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .card .top { display: flex; gap: 0.7rem; align-items: flex-start; }
    .card .body { flex: 1; min-width: 0; }
    .card .thumb {
      width: 104px;
      height: 104px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      flex: none;
      cursor: zoom-in;
    }
    .card.edited { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .card .title {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .card .meta { opacity: 0.75; font-size: 0.82rem; }
    .digits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem;
      margin-top: 0.45rem;
    }
    .digits label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px dashed var(--line);
      padding: 0.15rem 0.4rem;
      font-size: 0.8rem;
    }
    .digits input {
      width: 2.6rem;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      font: inherit;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      padding: 0.05rem 0.1rem;
    }
    .digits input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .digits input.changed { background: #fff3e0; }
    .digits .nodigits {
      grid-column: 1 / -1;
      border: 1px dashed var(--line);
      padding: 0.4rem 0.5rem;
      font-size: 0.8rem;
      color: #7a8396;
      background: repeating-linear-gradient(135deg, #fbfbfc, #fbfbfc 6px, #f4f5f7 6px, #f4f5f7 12px);
    }
    .zoomline {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.45rem; font-size: 0.78rem; opacity: 0.8;
    }
    .zoomline img { width: 74px; height: 74px; object-fit: cover; cursor: zoom-in;
      border: 1px solid var(--line); border-radius: 4px; }
    .fixnote { font-size: 0.78rem; color: #2f6fed; margin-top: 0.3rem; }
    .review {
      font-size: 0.78rem; color: #9a6700; background: #fff8e6;
      border-left: 3px solid #d9a441; padding: 0.25rem 0.45rem; margin-top: 0.35rem;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 26, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: zoom-out;
    }
    .lightbox.on { display: flex; }
    .lightbox img { max-width: 86vw; max-height: 86vh; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>印章识别</h1>
      <p>上传成长记录册盖章页，默认经 DeepSeek 视觉识别知章 / 行章、盖法与方章四角数字。</p>
    </div>
    <a class="link" href="/demo">盖法设计演示 →</a>
  </header>

  <main>
    <section class="upload-zone" id="dropZone">
      <strong>拖拽图片到这里，或点击选择</strong>
      <span>支持 PNG / JPG / WEBP · 建议清晰扫描件</span>
      <div class="actions" style="align-items:center">
        <button type="button" id="btnPick">选择图片</button>
        <button type="button" class="secondary" id="btnSample">用样页试跑</button>
      </div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/bmp" />
    </section>

    <div class="status" id="status"></div>

    <div class="layout">
      <section class="panel">
        <h2>识别标注图</h2>
        <div class="preview" id="preview">
          <div class="placeholder">上传后这里显示标注结果</div>
        </div>
      </section>
      <section class="panel">
        <h2>识别结果</h2>
        <div class="summary" id="summary" hidden>
          <div class="stat"><b id="sGroups">0</b><span>印章组</span></div>
          <div class="stat"><b id="sCells">0</b><span>盖印单元</span></div>
          <div class="stat"><b id="sZhi">0</b><span>知章合计</span></div>
          <div class="stat"><b id="sXing">0</b><span>行章合计</span></div>
        </div>
        <div class="methods" id="methods" hidden></div>
        <div class="warn" id="warn" hidden></div>
        <div class="edit-note" id="editNote" hidden></div>
        <div class="list" id="list">
          <div class="placeholder" style="opacity:.5;padding:.5rem 0">尚无结果</div>
        </div>
      </section>
    </div>
  </main>
  <div class="lightbox" id="lightbox"><img alt=""></div>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");
    const list = document.getElementById("list");
    const summary = document.getElementById("summary");

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function renderResult(data) {
      const s = data.summary || {};
      summary.hidden = false;
      document.getElementById("sGroups").textContent = s.groups ?? 0;
      document.getElementById("sCells").textContent = s.cells ?? 0;
      document.getElementById("sZhi").textContent = s.zhi_total ?? 0;
      document.getElementById("sXing").textContent = s.xing_total ?? 0;

      const warnEl = document.getElementById("warn");
      const warns = [];
      if (data.warning) warns.push(data.warning);
      if (data.fallback_from) {
        warns.push(`已从逐组识别退回整页识别，四角数字可能不准。`);
      }
      if (Array.isArray(data.degraded) && data.degraded.length) {
        warns.push(
          `流程有 ${data.degraded.length} 处降级：` +
            data.degraded
              .map((d) => `${d.stage} — ${d.reason}（${d.action || "已跳过"}）`)
              .join("；")
        );
      }
      if (Array.isArray(data.failed_cells) && data.failed_cells.length) {
        warns.push(`有 ${data.failed_cells.length} 组单组识别调用失败，请重试这几组。`);
      }
      if (Array.isArray(data.dropped_groups) && data.dropped_groups.length) {
        warns.push(
          `有 ${data.dropped_groups.length} 组定位到但没读出枚数（已排除在结果外）：` +
            data.dropped_groups.map((d) => d.verdict || d.reason).join("；")
        );
      }
      if (data.review_groups) {
        warns.push(`有 ${data.review_groups} 组标了「需复核」：这些是机器判不准的地方（叠盖朝向、被遮枚数、两路读数不一致），请对照卡片上的放大图确认。`);
      }
      if (warns.length) {
        warnEl.hidden = false;
        warnEl.textContent = warns.join(" ");
      } else {
        warnEl.hidden = true;
      }

      const methodsEl = document.getElementById("methods");
      const stamps = data.stamps || [];
      const tally = new Map();
      stamps.forEach((st) => {
        const k = `${st.method_id}. ${st.method_name}`;
        tally.set(k, (tally.get(k) || 0) + 1);
      });
      if (tally.size) {
        methodsEl.hidden = false;
        methodsEl.innerHTML = [...tally.entries()]
          .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
          .map(([k, v]) => `<span class="chip">${escapeHtml(k)} <b>×${v}</b></span>`)
          .join("");
      } else {
        methodsEl.hidden = true;
      }

      if (data.preview_base64) {
        preview.innerHTML = `<img alt="识别结果" src="data:image/jpeg;base64,${data.preview_base64}" />`;
      } else if (data.result_image) {
        preview.innerHTML = `<img alt="识别结果" src="${data.result_image}" />`;
      }

      const note = data.page_note ? String(data.page_note) : "";
      if (!stamps.length) {
        list.innerHTML = `<div class="placeholder" style="opacity:.75">未检测到印章${
          note ? "：" + escapeHtml(note) : ""
        }<br /><span style="opacity:.7">页面类型：${
          data.page_type === "B" ? "盖法说明页" : data.page_type === "A" ? "记录页" : "未知"
        } · 已调用 ${data.attempts || 1} 次</span></div>`;
        return;
      }
      list.innerHTML = stamps.map((st, i) => {
        const d = st.corner_digits || {};
        const hasZhi = st.zhi > 0;
        const ori = !hasZhi || st.orientation == null ? "—" : (st.orientation + "°");
        const pos = st.row >= 0 ? `第 ${st.row + 1} 行` : "未入格";
        const rawMismatch =
          st.raw_counts && st.raw_counts !== `${st.zhi}/${st.xing}`
            ? `<div class="meta" style="opacity:.6">模型原始计数 ${st.raw_counts}（已按盖法规则归一）</div>`
            : "";
        const thumb = st.crop_base64
          ? `<img class="thumb" src="data:image/jpeg;base64,${st.crop_base64}" title="点击放大">`
          : "";
        const oriFixed =
          st.rotation_fixed_by === "cv"
            ? `<div class="meta" style="color:#2f6fed">朝向按章面图案校正（模型原判 ${
                st.rotation_model === "rotated" ? "旋转180°" : "正向"
              }）</div>`
            : st.rotation_fixed_by === "tpl"
            ? `<div class="meta" style="color:#2f6fed">按模板相关认出「本组内一枚正向、一枚旋转」，判为改进章</div>`
            : "";
        const countFixed = st.count_fixed_by
          ? `<div class="meta" style="color:#2f6fed">枚数按独立计数修正（模型原读 ${
              st.count_model || "—"
            }）</div>`
          : "";
        const cell = (key) => {
          const v = d[key];
          return `<label>${key}<input type="text" inputmode="numeric" maxlength="1"
            data-g="${i}" data-k="${key}" value="${v == null ? "" : v}"
            placeholder="—" title="可直接改，改完即时生效"></label>`;
        };
        const zoomLine = st.zoom_bl
          ? `<div class="zoomline"><img class="thumb" src="data:image/jpeg;base64,${st.zoom_bl}"
               title="点击放大"><span>左下角放大图（用于核对最易经错的这一角）</span></div>`
          : "";
        const fixNotes = []
          .concat((st.digit_fixed || []).map((f) => `${f.corner} ${f.from} → ${f.to}（按三窗放大图校正）`))
          .concat((st.digit_filled_detail || []).map((f) => `${f.corner} 补读为 ${f.to}`))
          .map((t) => `<div class="fixnote">${t}</div>`)
          .join("");
        const reviewNotes = (st.review || [])
          .map((t) => `<div class="review">需复核：${t}</div>`)
          .join("");
        return `<article class="card" id="card${i}">
          <div class="top">
            ${thumb}
            <div class="body">
              <div class="title">${i + 1}. ${st.method_name}</div>
              <div class="meta">盖法 ${st.method_id} · ${pos} · 朝向 ${ori}</div>
              <div class="meta">知章 ${st.zhi} · 行章 ${st.xing}</div>
              ${oriFixed}
              ${countFixed}
              ${rawMismatch}
            </div>
          </div>
          <div class="digits">${
            hasZhi
              ? ["左上", "右上", "左下", "右下"].map(cell).join("")
              : `<div class="nodigits">行章（黄色圆章）没有四角数字，无需填写</div>`
          }</div>
          ${zoomLine}
          ${fixNotes}
          ${reviewNotes}
        </article>`;
      }).join("");
      bindDigitEdit();
    }

    // 四角数字可直接改：模型对 2/3 易混，人眼一眼就能看出来，改完即时生效
    let editedCount = 0;
    function bindDigitEdit() {
      editedCount = 0;
      list.querySelectorAll(".digits input").forEach((el) => {
        el.addEventListener("input", () => {
          el.value = el.value.replace(/[^1-9]/g, "").slice(0, 1);
          const card = el.closest(".card");
          const changed = el.value !== (el.dataset.orig ?? "");
          el.classList.toggle("changed", changed);
          card.classList.toggle("edited", !!card.querySelector(".digits input.changed"));
          recountEdited();
        });
        el.dataset.orig = el.value;
      });
    }
    function recountEdited() {
      editedCount = list.querySelectorAll(".digits input.changed").length;
      const box = document.getElementById("editNote");
      if (box) {
        box.hidden = editedCount === 0;
        box.textContent = `已手动修正 ${editedCount} 处数字`;
      }
    }

    // 点小图放大，方便核对
    document.addEventListener("click", (e) => {
      const lb = document.getElementById("lightbox");
      const t = e.target.closest(".thumb");
      if (t) {
        lb.querySelector("img").src = t.src;
        lb.classList.add("on");
      } else if (lb.classList.contains("on")) {
        lb.classList.remove("on");
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.getElementById("lightbox").classList.remove("on");
    });

    function setBusy(busy) {
      document.getElementById("btnPick").disabled = busy;
      document.getElementById("btnSample").disabled = busy;
    }

    async function postRecognize(fd) {
      setBusy(true);
      const started = Date.now();
      setStatus("DeepSeek 识别中（约 15–60 秒）…", "");
      const tick = setInterval(() => {
        const sec = Math.round((Date.now() - started) / 1000);
        setStatus(`DeepSeek 识别中…已等待 ${sec}s`, "");
      }, 1000);
      try {
        const res = await fetch("/api/recognize", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.ok) {
          setStatus(data.error || "识别失败", "err");
          return;
        }
        const sec = Math.round((Date.now() - started) / 1000);
        const typeLabel =
          data.mode === "cell"
            ? "逐组裁切"
            : data.page_type === "B"
              ? "盖法说明页"
              : data.page_type === "A"
                ? "记录页"
                : "未知页";
        const noteTail = data.page_note ? ` · ${data.page_note}` : "";
        const retryTail = data.attempts > 1 ? ` · 重试 ${data.attempts - 1} 次` : "";
        setStatus(
          `完成（DeepSeek·${typeLabel}）：共 ${data.summary.groups} 组印章 · ${sec}s${retryTail}${noteTail}`,
          data.summary.groups ? "ok" : "err",
        );
        renderResult(data);
      } finally {
        clearInterval(tick);
        setBusy(false);
      }
    }

    async function recognizeFile(file) {
      const fd = new FormData();
      fd.append("file", file);
      await postRecognize(fd);
    }

    async function recognizeSample() {
      const fd = new FormData();
      fd.append("sample", "1");
      await postRecognize(fd);
    }

    fetch("/api/status")
      .then((r) => r.json())
      .then((s) => {
        if (!s.deepseek_configured) {
          setStatus("未配置 DEEPSEEK_API_KEY。请在项目根目录 .env 写入密钥后重启服务。", "err");
        }
      })
      .catch(() => {});

    document.getElementById("btnPick").addEventListener("click", (e) => {
      e.stopPropagation();
      fileInput.click();
    });
    document.getElementById("btnSample").addEventListener("click", (e) => {
      e.stopPropagation();
      recognizeSample().catch((err) => setStatus(String(err), "err"));
    });
    dropZone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (f) recognizeFile(f).catch((err) => setStatus(String(err), "err"));
    });

    ["dragenter", "dragover"].forEach((ev) => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.add("drag");
      });
    });
    ["dragleave", "drop"].forEach((ev) => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag");
      });
    });
    dropZone.addEventListener("drop", (e) => {
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) recognizeFile(f).catch((err) => setStatus(String(err), "err"));
    });
  </script>
</body>
</html>
